name: macos-release

# Builds downloadable macOS binaries without tying up the local Mac.
# Runs automatically on every push to main and can also be triggered manually
# from the Actions tab (the file lives on the default branch). macos-port is a
# mirror of main, so it no longer triggers its own duplicate run. The heavy
# Linux test suite lives in test.yml; this workflow adds a lib-only test job so
# the macOS cfg paths get executed somewhere.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile (release-fast is much quicker, release is full LTO)
        required: false
        default: release-fast
        type: choice
        options:
          - release-fast
          - release

env:
  CARGO_TERM_COLOR: always

# Cancel a superseded dispatch on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: artifact (${{ matrix.target }}, ${{ inputs.profile || 'release-fast' }})
    # macos-15-intel is GitHub's last Intel image (supported until Fall 2027);
    # macos-15 is Apple Silicon. First cold run is slow; later runs reuse the
    # rust-cache entry.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artifact: ferrosonic-macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            artifact: ferrosonic-macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Release-profile artifacts are large; keep the cache under the
          # 10 GB GitHub limit by dropping debug info from cached builds.
          env-vars: CARGO_PROFILE_RELEASE_DEBUG=0 CARGO_PROFILE_RELEASE_FAST_DEBUG=0
      # Only the app binary is needed; test/dev-dependencies stay out of the
      # build, which is what makes this job tractable on the 3-core runner.
      - name: Build
        run: |
          cargo build --locked --target ${{ matrix.target }} \
            --profile "${{ inputs.profile || 'release-fast' }}" \
            --bin ferrosonic
      # Lint the production code for the macOS target on every push; the
      # Linux clippy gate in test.yml cannot see the
      # #[cfg(target_os = "macos")] modules. lib+bins only: --all-targets
      # would compile ~151 test binaries on the 3-core runner.
      - name: Clippy (macOS cfg coverage)
        run: cargo clippy --lib --bins --locked --target ${{ matrix.target }}
      - name: Stage artifact
        run: |
          prof="${{ inputs.profile || 'release-fast' }}"
          mkdir -p stage
          cp "target/${{ matrix.target }}/${prof}/ferrosonic" "stage/${{ matrix.artifact }}"
          # Bare filename so `shasum -a 256 -c` works from inside the download.
          (cd stage && shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: stage/
          if-no-files-found: error
          retention-days: 14

  # Lib unit tests on Apple Silicon. Integration tests (~151 binaries) are too
  # slow for the macOS runners; the Linux gate in test.yml covers those. This
  # job executes the #[cfg(target_os = "macos")] code the Linux gate cannot.
  test-lib:
    name: lib tests (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-lib-tests
          env-vars: CARGO_PROFILE_RELEASE_DEBUG=0 CARGO_PROFILE_RELEASE_FAST_DEBUG=0
      - name: Lib tests
        run: cargo test --locked --lib
